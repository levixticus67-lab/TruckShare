services:
  - type: web
    name: returnhaul-api
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/db run migrate && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ESMS_API_KEY
        sync: false
      - key: ESMS_ACCOUNT_ID
        sync: false
      - key: ESMS_SENDER_ID
        sync: false
      - key: NODE_ENV
        value: production